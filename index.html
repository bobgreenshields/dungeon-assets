<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Assets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f4f1ea; font-family: 'IBM Plex Sans', sans-serif; }
  a { color: #a8602e; text-decoration: none; }
  a:hover { color: #c97a3f; text-decoration: underline; }
  .page { width: 1440px; background: #fffdf9; border-radius: 4px; }
  .card { background: #fffdf9; border-radius: 10px; overflow: hidden; border: 1px solid #ded4c2; cursor: pointer; box-shadow: 0 1px 3px rgba(60,45,20,0.06); }
  .card:hover { border-color: #c97a3f; }
  .art-placeholder { width: 100%; height: 130px; background: #ece5d6; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8a7f6a; text-align: center; padding: 0 10px; }
  #about-modal { display: none; position: fixed; inset: 0; background: rgba(40,32,18,0.5); z-index: 1000; align-items: center; justify-content: center; }
  #about-modal.open { display: flex; }
  #about-modal .box { background: #fffdf9; border-radius: 10px; padding: 28px 32px; max-width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
  #about-modal .close { display: inline-block; margin-top: 18px; font-size: 13px; font-weight: 600; color: #a8602e; cursor: pointer; }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
    <rect width="80" height="56" fill="#fffdf9"/>
    <rect x="10" y="16" width="16" height="12" rx="2" fill="#c9a35f"/>
    <rect x="32" y="16" width="16" height="12" rx="2" fill="#8fa5c9"/>
    <rect x="54" y="16" width="16" height="12" rx="2" fill="#c98f9f"/>
    <text x="40" y="45" font-family="sans-serif" font-size="9" fill="#5a4d33" text-anchor="middle">Dungeon Assets</text>
  </svg>
</template>

<div class="scaler" style="width:1440px; transform-origin: top left;">
<div class="page">

  <div style="height:60px; background:#fffdf9; display:flex; align-items:center; gap:28px; padding:0 28px; border-bottom:1px solid #e6ddc9; border-radius:4px 4px 0 0;">
    <div style="font-family:'Spectral',serif; font-weight:600; font-size:19px; color:#3c3320; white-space:nowrap;">Dungeon Assets</div>
    <div style="display:flex; gap:22px; font-size:15px; color:#8a7f6a; font-weight:500; margin-left:auto;">
      <a href="#" id="about-link">About</a>
    </div>
  </div>

  <div style="padding:28px; display:grid; grid-template-columns:repeat(4, 1fr); gap:20px;">
    <a href="sewers-of-kadar/index.html" class="card">
      <img class="art" src="sewers-of-kadar/area-maps/00.png" alt="Sewers of Kadar" style="width:100%; height:130px; display:block; object-fit:cover;">
      <div style="padding:14px;">
        <div style="font-family:'Spectral',serif; font-weight:600; font-size:16px; color:#3c3320;">Sewers of Kadar</div>
        <div style="font-size:12px; color:#7a6f58; margin-top:6px; line-height:1.4;">Map fragments for the sewer dungeon, ready to link into other sites.</div>
        <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#a8602e; margin-top:10px;">5 areas &nbsp;&nbsp; 1 pdf</div>
      </div>
    </a>
  </div>
</div>
</div>

<div id="about-modal">
  <div class="box">
    <div style="font-family:'Spectral',serif; font-weight:600; font-size:17px; color:#3c3320; margin-bottom:10px;">About</div>
    <div style="font-size:14px; color:#5a4d33; line-height:1.5;">A website hosting assets for Bob's dungeons.</div>
    <div class="close" id="about-close">Close</div>
  </div>
</div>

<script>
  var aboutModal = document.getElementById('about-modal');
  document.getElementById('about-link').addEventListener('click', function(e) {
    e.preventDefault();
    aboutModal.classList.add('open');
  });
  document.getElementById('about-close').addEventListener('click', function() {
    aboutModal.classList.remove('open');
  });
  aboutModal.addEventListener('click', function(e) {
    if (e.target === aboutModal) aboutModal.classList.remove('open');
  });
</script>
<script>
  function scaleToFit() {
    var scaler = document.querySelector('.scaler');
    var scale = Math.min(1, window.innerWidth / 1440);
    scaler.style.transform = 'scale(' + scale + ')';
    document.body.style.height = (document.querySelector('.page').offsetHeight * scale) + 'px';
  }
  window.addEventListener('resize', scaleToFit);
  scaleToFit();
</script>
</body>
</html>
