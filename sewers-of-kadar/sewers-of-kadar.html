<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sewers of Kadar — Area Maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="image-slot.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #f4f1ea; font-family: 'IBM Plex Sans', sans-serif; }
  a { color: #a8602e; text-decoration: none; }
  a:hover { color: #c97a3f; text-decoration: underline; }
  .page { width: 1440px; background: #fffdf9; border-radius: 4px; }
  .thumb-card { background: #fffdf9; border-radius: 10px; overflow: hidden; border: 1px solid #ded4c2; cursor: pointer; box-shadow: 0 1px 3px rgba(60,45,20,0.06); }
  .thumb-card:hover { border-color: #c97a3f; }
  .thumb-box { width: 100%; height: 180px; }
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(40,32,18,0.82); z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
    <rect width="80" height="56" fill="#fffdf9"/>
    <rect x="20" y="14" width="40" height="28" rx="2" fill="#c9a35f"/>
    <text x="40" y="48" font-family="sans-serif" font-size="8" fill="#5a4d33" text-anchor="middle">Sewers of Kadar</text>
  </svg>
</template>

<div class="scaler" style="width:1440px; transform-origin: top left;">
<div class="page">

  <div style="height:60px; background:#fffdf9; display:flex; align-items:center; gap:28px; padding:0 28px; border-bottom:1px solid #e6ddc9; border-radius:4px 4px 0 0;">
    <div style="font-family:'Spectral',serif; font-weight:600; font-size:19px; color:#3c3320; white-space:nowrap;">Dungeon Assets</div>
  </div>

  <div style="padding:16px 28px 0; font-size:13px; color:#8a7f6a;">
    <a href="dungeon-assets-index.html">Dungeon Assets</a> &middot; <span style="color:#5a4d33;">Sewers of Kadar</span>
  </div>

  <div style="padding:20px 28px 28px;">
    <div style="font-family:'Spectral',serif; font-weight:700; font-size:24px; color:#3c3320; margin-bottom:4px;">Sewers of Kadar</div>
    <div style="font-size:13px; color:#8a7f6a; margin-bottom:20px;">area-maps &middot; 5 files</div>
    <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:18px;">
      <div class="thumb-card" data-full="sewers-of-kadar/area-maps/00.png" data-name="00.png">
        <image-slot class="thumb-box" id="thumb-00" shape="rect" placeholder="00.png"></image-slot>
        <div style="padding:10px 12px; font-size:13px; font-weight:600; color:#3c3320;">00.png</div>
      </div>
      <div class="thumb-card" data-full="sewers-of-kadar/area-maps/01.png" data-name="01.png">
        <image-slot class="thumb-box" id="thumb-01" shape="rect" placeholder="01.png"></image-slot>
        <div style="padding:10px 12px; font-size:13px; font-weight:600; color:#3c3320;">01.png</div>
      </div>
      <div class="thumb-card" data-full="sewers-of-kadar/area-maps/02.png" data-name="02.png">
        <image-slot class="thumb-box" id="thumb-02" shape="rect" placeholder="02.png"></image-slot>
        <div style="padding:10px 12px; font-size:13px; font-weight:600; color:#3c3320;">02.png</div>
      </div>
      <div class="thumb-card" data-full="sewers-of-kadar/area-maps/03.png" data-name="03.png">
        <image-slot class="thumb-box" id="thumb-03" shape="rect" placeholder="03.png"></image-slot>
        <div style="padding:10px 12px; font-size:13px; font-weight:600; color:#3c3320;">03.png</div>
      </div>
      <div class="thumb-card" data-full="sewers-of-kadar/area-maps/04.png" data-name="04.png">
        <image-slot class="thumb-box" id="thumb-04" shape="rect" placeholder="04.png"></image-slot>
        <div style="padding:10px 12px; font-size:13px; font-weight:600; color:#3c3320;">04.png</div>
      </div>
    </div>
  </div>
</div>
</div>

<div id="lightbox"><img id="lightbox-img" src="" alt=""></div>

<script>
  function scaleToFit() {
    var scaler = document.querySelector('.scaler');
    var scale = Math.min(1, window.innerWidth / 1440);
    scaler.style.transform = 'scale(' + scale + ')';
    document.body.style.height = (document.querySelector('.page').offsetHeight * scale) + 'px';
  }
  window.addEventListener('resize', scaleToFit);
  scaleToFit();

  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  document.querySelectorAll('.thumb-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.closest('image-slot') && e.target.closest('image-slot').hasAttribute('data-editing')) return;
      lightboxImg.src = card.getAttribute('data-full');
      lightboxImg.alt = card.getAttribute('data-name');
      lightbox.classList.add('open');
    });
  });
  lightbox.addEventListener('click', function() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  });
</script>
</body>
</html>
